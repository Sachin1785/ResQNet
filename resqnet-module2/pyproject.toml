[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resqnet"
version = "0.1.0"
description = "Hierarchical Fair Disaster Resource Allocator"
dependencies = [
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "networkx>=3.0",
    "scipy>=1.10.0",
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "numpy>=1.24.0",
    "osmnx>=1.9.0",
    "folium>=0.16.0",
    "geopandas>=0.14.0",
    "streamlit>=1.30.0",
    "streamlit-folium>=0.18.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
